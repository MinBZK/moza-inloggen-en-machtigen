<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>European Business Wallet: achtergrond</title>
  <link rel="stylesheet" href="https://esm.sh/@nldd/design-system@0.8.62/dist/css/global.css">
  <script type="module" src="https://esm.sh/@nldd/design-system@0.8.62"></script>
</head>
<body>
<nldd-app-view background="tinted">
  <nldd-page>

    <nldd-simple-section>
      <nldd-link size="sm" href="index.html" start-icon="chevron-left" text="Terug naar de roadmap"></nldd-link>
      <nldd-spacer size="24"></nldd-spacer>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="logos/ebw-donker.png">
        <img src="logos/ebw.png" alt="Logo European Business Wallet" height="28">
      </picture>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-title size="1">
        <span slot="overline">Roadmap inlog- en machtigingsmiddelen</span>
        <h1>European Business Wallet: achtergrond</h1>
        <p slot="subtitle">Hoe de zakelijke wallet (EBW) en de persoonlijke wallet (EDI) samenwerken met dienstverleners en MOZa.</p>
      </nldd-title>
      <nldd-spacer size="24"></nldd-spacer>
      <nldd-list variant="box" type="navigation" aria-label="Achtergrond EBW">
        <nldd-list-item href="ebw-landschap.html">
          <nldd-spacer-cell slot="start" size="12"></nldd-spacer-cell>
          <nldd-icon-cell slot="start" icon="centralized-network" color="accent" size="24" vertical-alignment="top"></nldd-icon-cell>
          <nldd-spacer-cell slot="start" size="8"></nldd-spacer-cell>
          <nldd-text-cell text="**Het EBW-landschap: PuB of Q**" supporting-text="Schema met de Belastingdienst (PuB-EBW, zelf beheerd), de gemeente Nijmegen (Q-EBW via een commerciële aanbieder) en een onderneming met eigenaar en werknemer."></nldd-text-cell>
          <nldd-icon-cell icon="chevron-right" color="secondary" size="20"></nldd-icon-cell>
        </nldd-list-item>
        <nldd-list-item href="ebw-flows.html">
          <nldd-spacer-cell slot="start" size="12"></nldd-spacer-cell>
          <nldd-icon-cell slot="start" icon="check-list" color="accent" size="24" vertical-alignment="top"></nldd-icon-cell>
          <nldd-spacer-cell slot="start" size="8"></nldd-spacer-cell>
          <nldd-text-cell text="**Wallet-flows stap voor stap**" supporting-text="Interactieve flows met diagram en gegevenstabel: Inloggen op MOZa en Gezamenlijke subsidie."></nldd-text-cell>
          <nldd-icon-cell icon="chevron-right" color="secondary" size="20"></nldd-icon-cell>
        </nldd-list-item>
      </nldd-list>
    </nldd-simple-section>


    <nldd-page-footer>
      <nldd-container padding="24">
        <nldd-rich-text spacing="tight"><p>Concept roadmap MOZa - inlog- en machtigingsmiddelen. Versie oktober 2026.</p></nldd-rich-text>
      </nldd-container>
    </nldd-page-footer>
  </nldd-page>
</nldd-app-view>

</body>
</html>
