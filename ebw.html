const markTag = (m, size = 'sm') => `<nldd-tag size="${size}" color="${MARKS[m].color}" icon="${MARKS[m].icon}" text="${esc(m)}"></nldd-tag>`;

document.getElementById('legend').innerHTML = ['ontwerpkeuze', 'aanname', 'aandachtspunt'].map((m) => markTag(m, 'md')).join('');

const detailList = (rows) => `
  <nldd-list variant="box">
    ${rows.map(([key, value, mark]) => `
    <nldd-list-item>
      <nldd-text-cell size="sm" overline="${esc(key)}" text="${esc(value)}"></nldd-text-cell>
      ${mark ? `<nldd-spacer-cell size="8"></nldd-spacer-cell><nldd-cell vertical-alignment="center">${markTag(mark)}</nldd-cell>` : ''}
    </nldd-list-item>`).join('')}
  </nldd-list>`;

const stepCard = (flow, [short, title, paras, key, rows], i) => `
  <nldd-card id="${flow.id}-${i}" accessible-label="${esc(`${flow.name}, stap ${i}: ${title}`)}">
    <nldd-container padding="16" gap="12">
      <nldd-title size="4">
        <span slot="overline">${esc(`Stap ${i} van ${flow.steps.length - 1} · ${short}`)}</span>
        <h3>${esc(title)}</h3>
      </nldd-title>
      <nldd-rich-text>${paras.map((p) => `<p>${esc(p)}</p>`).join('')}</nldd-rich-text>
      <nldd-banner variant="neutral" icon="info-circle" text="${esc(key)}"></nldd-banner>
      ${detailList(rows)}
    </nldd-container>
  </nldd-card>`;

document.getElementById('flows').innerHTML = FLOWS.map((flow) => `
  <nldd-simple-section id="${flow.id}">
    <nldd-title size="2">
      <span slot="overline">Scenario</span>
      <h2>${esc(flow.name)}</h2>
      <p slot="subtitle">${esc(flow.intro)}</p>
    </nldd-title>
    <nldd-spacer size="24"></nldd-spacer>
    <nldd-container gap="16">
      ${flow.steps.map((s, i) => stepCard(flow, s, i)).join('')}
    </nldd-container>
  </nldd-simple-section>`).join('');
</script>
</body>
</html>
