<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen</title>
  <link rel="stylesheet" href="https://esm.sh/@nldd/design-system@0.8.99/dist/css/global.css">
  <script type="module" src="https://esm.sh/@nldd/design-system@0.8.99"></script>
</head>
<!-- Eén sjabloon voor alle inlogmomenten. De server zet data-variant (pagina, opmerkingen of fout)
     en, waar bekend, data-rd (het pad om na het inloggen naar terug te gaan). -->
<body data-variant="pagina" data-rd="">
<nldd-shell background="tinted">
  <nldd-page>

    <nldd-simple-section id="inhoud">
      <nldd-title size="1">
        <span slot="overline">Roadmap inlog- en machtigingsmiddelen MOZa</span>
        <h1 id="kop">Inloggen om deze pagina te bekijken</h1>
      </nldd-title>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-rich-text>
        <p id="uitleg">Deze pagina is alleen te bekijken met een rijksaccount (SSO Rijk).</p>
        <p>Je kiest eerst de organisatie waar je werkt en logt daar in. Daarna kom je vanzelf terug op de pagina.</p>
      </nldd-rich-text>
      <nldd-spacer size="24"></nldd-spacer>
      <nldd-container layout="wrap" gap="12">
        <nldd-button id="inloggen" appearance="primary" start-icon="person" text="Inloggen met je rijksaccount" href="/auth/login"></nldd-button>
        <nldd-button id="terug" appearance="neutral-tinted" start-icon="chevron-left" text="Terug naar de vorige pagina" hidden></nldd-button>
      </nldd-container>
      <!--OPENBAAR-->
    </nldd-simple-section>

  </nldd-page>
</nldd-shell>
<script>
  const TEKST = {
    pagina: ['Inloggen om deze pagina te bekijken', 'Deze pagina is alleen te bekijken met een rijksaccount (SSO Rijk).', 'Inloggen met je rijksaccount'],
    opmerkingen: ['Inloggen om opmerkingen te plaatsen', 'Opmerkingen lezen en plaatsen kan alleen met een rijksaccount (SSO Rijk).', 'Inloggen met je rijksaccount'],
    fout: ['Inloggen is niet gelukt', 'Het inloggen met je rijksaccount (SSO Rijk) is verlopen of niet gelukt. Probeer het opnieuw.', 'Opnieuw inloggen'],
  };
  const variant = TEKST[document.body.dataset.variant] ? document.body.dataset.variant : 'pagina';
  const [kop, uitleg, knop] = TEKST[variant];
  const veilig = (p) => (p && p.startsWith('/') && !p.startsWith('//') ? p : '');
  // Bij een pagina achter de inlog staat deze pagina op het adres van die pagina, inclusief een eventuele #
  const rd = veilig(document.body.dataset.rd) || (variant === 'pagina' ? location.pathname + location.search + location.hash : '/');
  // Terug: naar de pagina waar de knop stond, of naar de vorige pagina op deze site
  const vorige = document.referrer.startsWith(location.origin) ? new URL(document.referrer).pathname : '';
  const terugNaar = variant === 'pagina' ? (vorige !== location.pathname ? vorige : '') : veilig(document.body.dataset.rd);

  document.title = kop;
  document.getElementById('kop').textContent = kop;
  document.getElementById('uitleg').textContent = uitleg;
  const inloggen = document.getElementById('inloggen');
  inloggen.setAttribute('text', knop);
  inloggen.setAttribute('href', `/auth/login?rd=${encodeURIComponent(rd)}`);
  if (terugNaar) {
    const terug = document.getElementById('terug');
    terug.setAttribute('href', terugNaar);
    terug.hidden = false;
  }
</script>
</body>
</html>
