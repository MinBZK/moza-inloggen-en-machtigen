name: Opmerking op de roadmap
description: Plaats een opmerking bij een onderdeel van de roadmap. Wordt meestal geopend vanuit de knop bij een punt in de verdieping.
title: "Opmerking: "
labels: ["opmerking"]
body:
  - type: input
    id: onderdeel
    attributes:
      label: Onderdeel
      description: Waar gaat je opmerking over? Wordt ingevuld vanuit de roadmap.
    validations:
      required: true
  - type: textarea
    id: opmerking
    attributes:
      label: Opmerking
      description: Je vraag, aanvulling of correctie.
    validations:
      required: true
  - type: input
    id: anker
    attributes:
      label: Anker
      description: Technische verwijzing naar het punt in de roadmap. Niet aanpassen.
    validations:
      required: true
