<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eHerkenning: achtergrond</title>
  <link rel="stylesheet" href="https://esm.sh/@nldd/design-system@0.8.62/dist/css/global.css">
  <script type="module" src="https://esm.sh/@nldd/design-system@0.8.62"></script>
</head>
<body>
<nldd-app-view background="tinted">
  <nldd-page>

    <nldd-simple-section id="inhoud">
      <nldd-link size="sm" href="index.html" start-icon="chevron-left" text="Terug naar de roadmap"></nldd-link>
      <nldd-spacer size="24"></nldd-spacer>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="logos/eherkenning-donker.svg">
        <img src="logos/eherkenning.svg" alt="Logo eHerkenning" height="32">
      </picture>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-title size="1">
        <span slot="overline">Roadmap inlog- en machtigingsmiddelen</span>
        <h1>eHerkenning: achtergrond</h1>
        <p slot="subtitle">Achtergrondinformatie bij het spoor eHerkenning in de roadmap.</p>
      </nldd-title>
      <nldd-spacer size="24"></nldd-spacer>
      <nldd-list variant="box" type="navigation" aria-label="Achtergrond eHerkenning">
        <nldd-list-item href="eherkenning-inlogflow.html">
          <nldd-spacer-cell slot="start" size="12"></nldd-spacer-cell>
          <nldd-icon-cell slot="start" icon="check-list" color="accent" size="24" vertical-alignment="top"></nldd-icon-cell>
          <nldd-spacer-cell slot="start" size="8"></nldd-spacer-cell>
          <nldd-text-cell text="**Inloggen met eHerkenning: de bestaande flow**" supporting-text="Stap voor stap wat er gebeurt als een werknemer namens zijn bedrijf inlogt bij UWV, en wie na afloop wat weet."></nldd-text-cell>
          <nldd-icon-cell icon="chevron-right" color="secondary" size="20"></nldd-icon-cell>
        </nldd-list-item>
        <nldd-list-item href="eherkenning-concept.html">
          <nldd-spacer-cell slot="start" size="12"></nldd-spacer-cell>
          <nldd-icon-cell slot="start" icon="centralized-network" color="accent" size="24" vertical-alignment="top"></nldd-icon-cell>
          <nldd-spacer-cell slot="start" size="8"></nldd-spacer-cell>
          <nldd-text-cell text="**Concept: inloggen op MOZa met eHerkenning**" supporting-text="Schema van machtigen en inloggen nu, en hoe we het voor het MOZa portaal zouden willen: één keer inloggen met toegang tot de onderliggende diensten. Met open vragen."></nldd-text-cell>
          <nldd-icon-cell icon="chevron-right" color="secondary" size="20"></nldd-icon-cell>
        </nldd-list-item>
      </nldd-list>
      <div id="opm-hint"></div>
    </nldd-simple-section>

    <nldd-page-footer>
      <nldd-container padding="24" gap="16">
        <div id="opm-knop"></div>
        <nldd-rich-text spacing="tight"><p>Concept roadmap MOZa - inlog- en machtigingsmiddelen. Versie oktober 2026.</p><p>Bij het maken van deze content is gebruikgemaakt van AI.</p></nldd-rich-text>
      </nldd-container>
    </nldd-page-footer>
  </nldd-page>
</nldd-app-view>
<script type="module" src="opmerkingen.js"></script>
<script defer src="begrippen.js"></script>
